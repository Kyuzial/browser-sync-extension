<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <!-- Header -->
  <header class="header">
    <div class="header-left">
      <svg class="logo-icon" id="syncIcon" viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M21 2v6h-6"/>
        <path d="M3 12a9 9 0 0 1 15-6.7L21 8"/>
        <path d="M3 22v-6h6"/>
        <path d="M21 12a9 9 0 0 1-15 6.7L3 16"/>
      </svg>
      <h1 class="header-title">Browser Sync</h1>
    </div>
    <span class="status-badge" id="statusBadge" title="Disconnected">
      <span class="status-dot" id="statusDot"></span>
      <span class="status-text" id="statusText">Offline</span>
    </span>
  </header>

  <!-- Last Sync -->
  <section class="last-sync" id="lastSyncSection">
    <span class="last-sync-label">Last sync</span>
    <span class="last-sync-time" id="lastSyncTime">Never</span>
  </section>

  <!-- Stats -->
  <section class="stats">
    <div class="stat-card">
      <svg class="stat-icon" viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M19 21l-7-5-7 5V5a2 2 0 0 1 2-2h10a2 2 0 0 1 2 2z"/>
      </svg>
      <div class="stat-info">
        <span class="stat-value" id="bookmarkCount">0</span>
        <span class="stat-label">Bookmarks</span>
      </div>
    </div>
    <div class="stat-card">
      <svg class="stat-icon" viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <rect x="2" y="3" width="20" height="14" rx="2" ry="2"/>
        <line x1="8" y1="21" x2="16" y2="21"/>
        <line x1="12" y1="17" x2="12" y2="21"/>
      </svg>
      <div class="stat-info">
        <span class="stat-value" id="tabCount">0</span>
        <span class="stat-label">Local Tabs</span>
      </div>
    </div>
  </section>

  <!-- Actions -->
  <section class="actions">
    <button class="btn btn-primary" id="syncNowBtn">
      <svg class="btn-icon" viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M21 2v6h-6"/>
        <path d="M3 12a9 9 0 0 1 15-6.7L21 8"/>
        <path d="M3 22v-6h6"/>
        <path d="M21 12a9 9 0 0 1-15 6.7L3 16"/>
      </svg>
      <span>Sync Now</span>
    </button>
  </section>

  <!-- Synced Tabs Section -->
  <section class="synced-tabs-section" id="syncedTabsSection">
    <div class="section-header" id="otherTabsHeader" role="button" tabindex="0">
      <div class="section-header-left">
        <svg class="section-icon" viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <rect x="2" y="3" width="20" height="14" rx="2" ry="2"/>
          <line x1="8" y1="21" x2="16" y2="21"/>
          <line x1="12" y1="17" x2="12" y2="21"/>
        </svg>
        <span class="section-title">Tabs open on other browsers</span>
      </div>
      <div class="section-header-right">
        <span class="badge" id="otherDevicesCount">0</span>
        <svg class="chevron-icon" id="otherTabsChevron" viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <polyline points="6 9 12 15 18 9"/>
        </svg>
      </div>
    </div>

    <div class="section-body" id="otherTabsBody">
      <div class="device-list" id="deviceList">
        <!-- Dynamically rendered per-browser collapsible cards -->
      </div>
      <div class="empty-tabs-message" id="emptyTabsMessage" style="display: none;">
        No tabs open on other browsers
      </div>
    </div>
  </section>

  <!-- Footer -->
  <footer class="footer">
    <a href="#" id="openOptions" class="footer-link">
      <svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <circle cx="12" cy="12" r="3"/>
        <path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06A1.65 1.65 0 0 0 4.68 15a1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06A1.65 1.65 0 0 0 9 4.68a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06A1.65 1.65 0 0 0 19.4 9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/>
      </svg>
      <span>Settings</span>
    </a>
    <div class="version-info" id="versionInfo">
      <span class="ext-version" id="extVersion">v1.1.0</span>
      <span class="version-sep">•</span>
      <span class="server-version" id="serverVersion">Server: --</span>
    </div>
  </footer>

  <script src="popup.js"></script>
</body>
</html>
