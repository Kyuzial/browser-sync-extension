<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Browser Sync — Settings</title>
  <link rel="stylesheet" href="options.css">
</head>
<body>
  <div class="container">
    <header class="header">
      <svg class="logo-icon" viewBox="0 0 24 24" width="28" height="28" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M21 2v6h-6"/>
        <path d="M3 12a9 9 0 0 1 15-6.7L21 8"/>
        <path d="M3 22v-6h6"/>
        <path d="M21 12a9 9 0 0 1-15 6.7L3 16"/>
      </svg>
      <div>
        <h1 class="header-title">Browser Sync</h1>
        <p class="header-subtitle">Settings</p>
      </div>
    </header>

    <!-- Connection Section -->
    <section class="section">
      <h2 class="section-title">Server Connection</h2>

      <label class="field-label" for="serverUrl">Server URL</label>
      <input type="url" id="serverUrl" class="input" placeholder="https://your-server.com" spellcheck="false">

      <label class="field-label" for="apiKey">API Key</label>
      <div class="input-group">
        <input type="password" id="apiKey" class="input input-with-btn" placeholder="bsync_…" spellcheck="false" autocomplete="off">
        <button type="button" class="btn-icon-toggle" id="toggleKeyVisibility" title="Show / Hide">
          <svg id="eyeIcon" viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/>
            <circle cx="12" cy="12" r="3"/>
          </svg>
        </button>
      </div>

      <button class="btn btn-outline" id="testConnectionBtn">
        <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"/>
          <polyline points="22 4 12 14.01 9 11.01"/>
        </svg>
        <span>Test Connection</span>
      </button>
      <p class="connection-result" id="connectionResult"></p>
    </section>

    <!-- Sync Preferences -->
    <section class="section">
      <h2 class="section-title">Sync Preferences</h2>

      <div class="toggle-row">
        <div>
          <span class="toggle-label">Auto-sync bookmarks</span>
          <span class="toggle-desc">Push changes when bookmarks are added, moved, or deleted</span>
        </div>
        <label class="toggle">
          <input type="checkbox" id="autoSyncBookmarks" checked>
          <span class="toggle-slider"></span>
        </label>
      </div>

      <div class="toggle-row" style="margin-top: 1rem;">
        <div>
          <span class="toggle-label">Force Upload to Server</span>
          <span class="toggle-desc">Overwrites the server with your local bookmarks</span>
        </div>
        <button class="btn btn-outline" id="forceSyncBtn">Force Upload</button>
      </div>

    </section>

    <!-- Save -->
    <section class="section section-actions">
      <button class="btn btn-primary" id="saveBtn">Save Settings</button>
    </section>

    <!-- Toast -->
    <div class="toast" id="toast"></div>
  </div>

  <script src="options.js"></script>
</body>
</html>
